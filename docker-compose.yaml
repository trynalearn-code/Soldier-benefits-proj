version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_NAME=myapp
    depends_on:
      - db
    restart: unless-stopped



volumes:
  postgres_data:
  db:
  ports:
    - ${3000}:${3000}
  container_name: supabase-db
  services:
  local_dev_atlas:
    image: mongodb/mongodb-atlas-local:8.0
    hostname: local_dev_atlas
    ports:
      - 27017:27017
    volumes:
      - data:/data/db
      - config:/data/configdb
volumes:
  - data:
  - config:
